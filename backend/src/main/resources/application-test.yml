server:
  port: ${FINANCE_AGENT_PORT:8081}

finance-agent:
  database:
    url: ${FINANCE_AGENT_DB_URL:jdbc:postgresql://localhost:5432/finance_agent_test}
    username: ${FINANCE_AGENT_DB_USERNAME:test}
    password: ${FINANCE_AGENT_DB_PASSWORD:}
    connect-timeout-seconds: ${FINANCE_AGENT_DB_CONNECT_TIMEOUT_SECONDS:2}
    socket-timeout-seconds: ${FINANCE_AGENT_DB_SOCKET_TIMEOUT_SECONDS:2}
    validation-timeout-seconds: ${FINANCE_AGENT_DB_VALIDATION_TIMEOUT_SECONDS:2}
  deep-seek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    stub: ${FINANCE_AGENT_DEEPSEEK_STUB:true}
  source:
    stub: ${FINANCE_AGENT_SOURCE_STUB:true}
  workspace:
    root: ${FINANCE_AGENT_WORKSPACE_ROOT:./.runtime/finance-agent-test}
  budget:
    max-steps: ${FINANCE_AGENT_MAX_STEPS:10}
    max-tokens: ${FINANCE_AGENT_MAX_TOKENS:8000}
    max-cost: ${FINANCE_AGENT_MAX_COST:0}
  identity:
    mode: ${FINANCE_AGENT_IDENTITY_MODE:test}
    seed-enabled: ${FINANCE_AGENT_IDENTITY_SEED_ENABLED:false}
  storage:
    mode: ${FINANCE_AGENT_STORAGE_MODE:memory}
    adapter-id: ${FINANCE_AGENT_STORAGE_ADAPTER_ID:temporary}
    temporary-root: ${FINANCE_AGENT_STORAGE_TEMPORARY_ROOT:./.runtime/finance-agent-test/objects}
    max-bytes: ${FINANCE_AGENT_STORAGE_MAX_BYTES:10485760}
  field-policy:
    strict: ${FINANCE_AGENT_FIELD_STRICT:true}
  diagnostics:
    api-enabled: ${FINANCE_AGENT_DIAGNOSTICS_API_ENABLED:false}
