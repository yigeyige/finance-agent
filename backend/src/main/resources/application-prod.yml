server:
  port: ${FINANCE_AGENT_PORT:8080}

finance-agent:
  database:
    url: ${FINANCE_AGENT_DB_URL:}
    username: ${FINANCE_AGENT_DB_USERNAME:}
    password: ${FINANCE_AGENT_DB_PASSWORD:}
  deep-seek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    stub: ${FINANCE_AGENT_DEEPSEEK_STUB:false}
  source:
    stub: ${FINANCE_AGENT_SOURCE_STUB:false}
  workspace:
    root: ${FINANCE_AGENT_WORKSPACE_ROOT:}
  budget:
    max-steps: ${FINANCE_AGENT_MAX_STEPS:20}
    max-tokens: ${FINANCE_AGENT_MAX_TOKENS:16000}
    max-cost: ${FINANCE_AGENT_MAX_COST:0}
  identity:
    mode: ${FINANCE_AGENT_IDENTITY_MODE:sso}
  storage:
    mode: ${FINANCE_AGENT_STORAGE_MODE:object-store}
  field-policy:
    strict: ${FINANCE_AGENT_FIELD_STRICT:true}
